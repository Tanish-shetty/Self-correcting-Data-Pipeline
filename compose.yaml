services:
  app:
    build: .
    environment:
      PIPELINE_DB_PATH: /app/data/pipeline.sqlite3
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: "5"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - pipeline_data:/app/data
volumes:
  pipeline_data:
